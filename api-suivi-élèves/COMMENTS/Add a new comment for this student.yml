info:
  name: Add a new comment for this student
  type: http
  seq: 1

http:
  method: POST
  url: "{{path}}/students/:id_student/comments"
  params:
    - name: id_student
      value: "17"
      type: path
  body:
    type: json
    data: |-
      {
        "content": "Bravo, Mr Lempi ne s'endort plus en cours!"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
