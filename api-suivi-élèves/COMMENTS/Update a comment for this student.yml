info:
  name: Update a comment for this student
  type: http
  seq: 1

http:
  method: PUT
  url: '{{path}}/students/:id_students/comments/:id_comments'
  params:
    - name: id_students
      value: '17'
      type: path
    - name: id_comments
      value: ' 3'
      type: path
  body:
    type: json
    data: |-
      {
        "content": "Attention, si Mr Lempi ne sort pas en cours, il parle sans arrêt !"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
