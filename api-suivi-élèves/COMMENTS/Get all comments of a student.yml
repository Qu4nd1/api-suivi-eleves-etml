info:
  name: Get all comments of a student
  type: http
  seq: 1

http:
  method: GET
  url: '{{path}}/students/:id_student/comments'
  params:
    - name: id_student
      value: '17'
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
